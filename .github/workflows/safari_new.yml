name: Track Safari and macOS Updates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      persist_results:
        description: Commit validated tracker results (leave off for validation only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: safari-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.check.outputs.has_work }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare Apple releases with trackers
        id: check
        shell: python
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          import html
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import urlopen

          with urlopen("https://support.apple.com/en-us/100100", timeout=60) as response:
              page = response.read().decode("utf-8")
          rows = []
          for row in re.findall(r"<tr\b[^>]*>(.*?)</tr>", page, re.I | re.S):
              cells = re.findall(r"<t[dh]\b[^>]*>(.*?)</t[dh]>", row, re.I | re.S)
              if len(cells) >= 3:
                  rows.append([
                      re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", cell))).strip()
                      for cell in cells[:3]
                  ])

          def latest(prefix, available=None):
              for name, platforms, _ in rows:
                  if available and available not in platforms:
                      continue
                  match = re.match(re.escape(prefix) + r"(\d+(?:\.\d+){0,2})(?![\d.])", name)
                  if match:
                      version = match.group(1)
                      return version if "." in version else version + ".0"
              return ""

          def known(kind, slug, name, key):
              path = Path(f"trackers/{kind}-{slug}.json")
              if path.exists():
                  return json.loads(path.read_text())
              legacy = Path(f"{kind}_known_versions.txt")
              if legacy.exists():
                  for line in legacy.read_text().splitlines():
                      if line.startswith(name + "="):
                          return {key: line.split("=", 1)[1].strip()}
              return {}

          tracks = [
              {"name": "Sequoia", "slug": "sequoia", "major": 15, "runner": "macos-15", "safari": True},
              {"name": "Tahoe", "slug": "tahoe", "major": 26, "runner": "macos-26", "safari": True},
              {"name": "Golden Gate", "slug": "golden-gate", "major": 27, "runner": "xcode-27", "safari": False},
          ]
          selected = []
          for track in tracks:
              name, slug = track["name"], track["slug"]
              target_os = latest(f"macOS {name} ")
              if not target_os:
                  raise RuntimeError(f"Cannot find macOS {name} on Apple's release page")
              target_safari = latest("Safari ", f"macOS {name}") if track["safari"] else ""
              if track["safari"] and not target_safari:
                  print(f"::warning::No standalone Safari release found for {name}; Safari tracker will be preserved")
              old_os = known("macos", slug, name, "update_version")
              old_safari = known("safari", slug, name, "safari_version") if track["safari"] else {}
              os_changed = (
                  target_os != old_os.get("update_version")
                  or not old_os.get("update_build")
                  or not old_os.get("size_bytes")
              )
              safari_changed = bool(target_safari and target_safari != old_safari.get("safari_version"))
              track.update(target_os=target_os, target_safari=target_safari, safari_changed=safari_changed)
              print(f"{name}: macOS={target_os}, Safari={target_safari or 'not tracked'}, runner={track['runner']}")
              if os_changed or safari_changed or os.environ["MANUAL"] == "true":
                  selected.append(track)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"has_work={str(bool(selected)).lower()}\n")
              output.write("matrix=" + json.dumps({"include": selected}) + "\n")

  get-versions:
    needs: check-release
    if: needs.check-release.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-release.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Collect offered updates and validate versions
        shell: python
        env:
          TRACK: ${{ toJSON(matrix) }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          import json
          import os
          import platform
          import plistlib
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          track = json.loads(os.environ["TRACK"])
          name, slug = track["name"], track["slug"]
          directory = Path("temp") / slug
          directory.mkdir(parents=True, exist_ok=True)

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def version_key(value):
              parts = tuple(int(part) for part in value.split("."))
              return parts + (0,) * max(0, 3 - len(parts))

          host_version = command("sw_vers", "-productVersion")
          host_build = command("sw_vers", "-buildVersion")
          if int(host_version.split(".")[0]) != track["major"]:
              raise RuntimeError(f"{track['runner']} runs macOS {host_version}, expected major {track['major']}")

          # Keep the original output even if softwareupdate fails or parsing rejects it.
          result = subprocess.run(
              ["sudo", "softwareupdate", "-l"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=900,
          )
          raw = result.stdout
          (directory / "softwareupdate-list.txt").write_text(raw)
          print(raw)
          result.check_returncode()

          def updates(text):
              records = []
              blocks = re.split(r"(?m)^\s*[*-]\s+Label:\s*", text)[1:]
              for block in blocks:
                  label, separator, details = block.partition("\n")
                  match = re.search(
                      r"Title:\s*(.*?),\s*Version:\s*([^,\n]+),\s*Size:\s*(\d+)\s*K(?:iB|B)?\b",
                      details,
                  )
                  if not separator or not match:
                      raise ValueError(f"Unrecognized softwareupdate record: {label}")
                  title, version, kib = match.groups()
                  records.append({
                      "label": label.strip(), "title": title.strip(),
                      "version": version.strip(), "size_kib": int(kib),
                      "size_bytes": int(kib) * 1024,
                  })
              if not blocks and not re.search(r"No new software available\.?", text, re.I):
                  raise ValueError("softwareupdate returned neither update records nor a recognized no-updates message")
              return records

          offered = updates(raw)
          os_updates = [
              record for record in offered
              if record["title"].startswith(f"macOS {name} ")
              and re.fullmatch(r"\d+(?:\.\d+){0,2}", record["version"])
              and int(record["version"].split(".")[0]) == track["major"]
          ]
          update = max(os_updates, key=lambda record: version_key(record["version"]), default=None)
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          macos = {
              "last_updated": now, "macos_name": name,
              "host_version": host_version, "host_build": host_build,
              "runner": track["runner"], "architecture": platform.machine(),
              "update_available": update is not None,
              "update_version": None, "update_label": None, "update_build": None,
              "size_kib": None, "size_bytes": None,
          }
          if update:
              build = re.search(r"-([0-9]+[A-Za-z][0-9]+[A-Za-z]?)$", update["label"])
              if not build or update["size_bytes"] <= 0:
                  raise ValueError(f"Missing build ID or positive download size: {update}")
              if not update["label"].endswith(f"{update['version']}-{build.group(1)}"):
                  raise ValueError(f"Label/version mismatch: {update}")
              macos.update(
                  update_version=update["version"], update_label=update["label"],
                  update_build=build.group(1), size_kib=update["size_kib"],
                  size_bytes=update["size_bytes"],
              )
          else:
              print(f"::warning::No {name} update offered; build and size are unknown, not zero")
          (directory / f"macos-{slug}.json").write_text(json.dumps(macos, indent=2) + "\n")
          print(json.dumps(macos, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### {name} ({track['runner']})\n\n```json\n")
              summary.write(json.dumps(macos, indent=2) + "\n```\n")
          if update and version_key(update["version"]) != version_key(track["target_os"]):
              raise RuntimeError(
                  f"Offered {name} {update['version']} does not match Apple release {track['target_os']}; not publishing"
              )

          if track["safari"] and track["target_safari"]:
              safari_updates = [
                  record for record in offered
                  if re.match(r"^Safari(?:\s|$)", record["title"])
                  and re.fullmatch(r"\d+(?:\.\d+){0,2}", record["version"])
                  and version_key(record["version"]) == version_key(track["target_safari"])
              ]
              if len(safari_updates) > 1:
                  raise ValueError("Multiple Safari packages match the target; refusing an ambiguous installation")
              safari_update = safari_updates[0] if safari_updates else None
              should_capture = track["safari_changed"] or os.environ["MANUAL"] == "true"
              if should_capture:
                  if safari_update:
                      # Never install macOS, use --all, or request a restart.
                      subprocess.run(
                          ["sudo", "softwareupdate", "-i", safari_update["label"], "--verbose"],
                          check=True, timeout=900,
                      )
                  with open("/Applications/Safari.app/Contents/Info.plist", "rb") as source:
                      info = plistlib.load(source)
                  with open("/Applications/Safari.app/Contents/version.plist", "rb") as source:
                      bundle = plistlib.load(source)
                  version, cfb = info["CFBundleShortVersionString"], bundle["CFBundleVersion"]
                  if version_key(version) != version_key(track["target_safari"]) or not cfb:
                      raise RuntimeError(
                          f"Installed Safari {version} does not match {track['target_safari']} or lacks CFBundleVersion"
                      )
                  safari = {
                      "last_updated": now, "macos_name": name, "macos_version": host_version,
                      "safari_version": version, "CFBundleVersion": cfb,
                      "size_bytes": safari_update["size_bytes"] if safari_update else None,
                      "size_source": "softwareupdate" if safari_update else "not_offered",
                  }
                  (directory / f"safari-{slug}.json").write_text(json.dumps(safari, indent=2) + "\n")
                  print(json.dumps(safari, indent=2))
      - name: Upload results and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updates-${{ matrix.slug }}
          path: temp/${{ matrix.slug }}/
          if-no-files-found: warn

  commit-results:
    needs: [check-release, get-versions]
    if: >-
      needs.check-release.outputs.has_work == 'true' &&
      (github.event_name == 'schedule' || inputs.persist_results)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: updates-*
          path: temp
          merge-multiple: true
      - name: Update validated trackers and history
        shell: python
        run: |
          import json
          from pathlib import Path

          Path("trackers").mkdir(exist_ok=True)
          Path("history").mkdir(exist_ok=True)
          for source in sorted(Path("temp").glob("*.json")):
              entry = json.loads(source.read_text())
              is_macos = source.name.startswith("macos-")
              if is_macos and not entry["update_available"]:
                  print(f"::warning::Preserving {source.name}: no update was offered")
                  continue
              keys = ("update_version", "update_build") if is_macos else ("CFBundleVersion",)
              if not all(entry.get(key) for key in keys):
                  raise ValueError(f"Incomplete tracker identity in {source}")
              if is_macos and (not isinstance(entry["size_bytes"], int) or entry["size_bytes"] <= 0):
                  raise ValueError(f"Invalid download size in {source}")
              tracker = Path("trackers") / source.name
              history = Path("history") / source.name
              previous = json.loads(tracker.read_text()) if tracker.exists() else {}
              entries = json.loads(history.read_text()) if history.exists() else []
              if not isinstance(entries, list):
                  raise ValueError(f"History must be a JSON array: {history}")
              # Do not erase a previously observed Safari package size when already installed.
              if not is_macos and entry["size_bytes"] is None:
                  if previous.get("CFBundleVersion") == entry["CFBundleVersion"] and previous.get("size_bytes"):
                      entry["size_bytes"] = previous["size_bytes"]
                      entry["size_source"] = "previous_tracker"
              compare = lambda value: {key: val for key, val in value.items() if key != "last_updated"}
              if compare(previous) != compare(entry):
                  tracker.write_text(json.dumps(entry, indent=2) + "\n")
              if not any(all(old.get(key) == entry[key] for key in keys) for old in entries):
                  entries.append(entry)
                  history.write_text(json.dumps(entries, indent=2) + "\n")
      - name: Commit and push changed results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trackers/ history/
          if git diff --staged --quiet; then
            echo "No tracker changes to commit"
          else
            git commit -m "chore: Apple updates $(date -u +%Y-%m-%d)"
            git push
          fi
